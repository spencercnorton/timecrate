name: Bug report
description: A backup, restore, drill or the window does the wrong thing, or says the wrong thing.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before pasting anything, remove machine names, user names, personal paths, remote names and account details. Never paste a key, a token or the contents of /etc/timecrate.env.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: After a restore, the kit list showed nothing although the remote holds kits.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Output of `timecrate version`, your Ubuntu release, and the rclone backend type (for example "dropbox" or "s3"), not its name or path.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines from `journalctl -u timecrate-backup.service` (or the drill or capstone unit), scrubbed.
      render: text
